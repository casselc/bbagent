# A1 TUI build configuration.
#
# charm.clj's terminal namespace is initialized at build time by
# graal-build-time, which puts org.jline.utils.InfoCmp$Capability enum
# constants into the image heap.  JLine classes are otherwise initialized at
# run time, and native-image rejects that combination, so the enum must be
# build-time initialized.  Without this the bbagent image fails to build.
#
# This file lives in bbagent's resources and is therefore only on the
# classpath of the bbagent application build.  Ordinary bb4t builds are
# unaffected.
Args=--initialize-at-build-time=org.jline.utils.InfoCmp$Capability
